name: Publish to npm
on:
  push:
    branches: [main]
    paths: ['package.json']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Require a publish-capable npm
        run: npm install -g 'npm@^11.5.1'
      - run: npm ci
      - name: Skip versions already published
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "ncell@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run checks
        if: steps.check.outputs.published != 'true'
        run: npm run check && npm run format:check
      - name: Publish to npm
        if: steps.check.outputs.published != 'true'
        # Authenticates via OIDC trusted publishing; no token is stored.
        # The package's trusted publisher on npmjs.com must name this file.
        run: npm publish
