name: Deploy documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'docs-source/**', 'scripts/**', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: rohityadav-sas/ncell-cli
          path: .local/docs-source
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run docs:sync -- --source .local/docs-source
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
